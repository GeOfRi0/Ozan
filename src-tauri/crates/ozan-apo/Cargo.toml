[package]
name = "ozan-apo"
version = "0.1.0"
edition = "2021"
description = "Ozan Windows User-Mode Audio Processing Object (sAPO COM DLL)"

[lib]
name = "ozan_apo"
crate-type = ["cdylib", "rlib"]

[dependencies]
ozan-shm = { path = "../ozan-shm" }
rubato = { path = "../rubato" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
] }
